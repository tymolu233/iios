name: iios sign-in

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0 * * *'

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IIOS_USERNAME: ${{ secrets.IIOS_USERNAME }}
      IIOS_PASSWORD: ${{ secrets.IIOS_PASSWORD }}
      IIOS_BASE_URL: ${{ vars.IIOS_BASE_URL || 'https://www.iios.fun' }}
      IIOS_WEBAPP: ${{ vars.IIOS_WEBAPP || 'true' }}
      IIOS_LOG_LEVEL: info
      IIOS_TIMEOUT_S: '45'
      IIOS_USER_AGENT: Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.7.5 Mobile/15E148 Safari/604.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Selftest
        run: python iios_signin.py --selftest

      - name: Sign-in
        run: python iios_signin.py --no-dry-run
