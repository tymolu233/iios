services:
  iios-signin:
    build:
      context: .
      dockerfile: Dockerfile
    image: iios-cloak-signin:latest
    env_file:
      - path: .env
        required: false
    environment:
      CLOAK_HEADLESS: "true"
      IIOS_PROFILE_DIR: /app/data/profile/iios.fun
      IIOS_ARTIFACT_DIR: /app/data/artifacts/iios.fun
      IIOS_LOG_LEVEL: info
      IIOS_SUCCESS_SCREENSHOT: "false"
    volumes:
      - ./data/profile:/app/data/profile
      - ./data/artifacts:/app/data/artifacts
    command: ["--dry-run"]
